AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Antares dev namespace: gate API, decision store, console site.
  Least-privilege by construction: the executor touches only the sandbox
  resources. No NAT, no always-on compute. Single-table dual-write pattern
  (no GSIs: the account early-validation hook rejects GSI creation, doc 06
  and what-broke). CloudFront serves the console and proxies /v1/* to the
  regional API same-origin; the OAC resource is blocked by the same hook,
  so the site bucket uses a read-only public policy (what-broke).

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 15
    Tracing: Active

Resources:
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: antares-dev-main
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - { Key: Project, Value: Antares }
        - { Key: Env, Value: dev }

  DemoLedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: antares-dev-ledger
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true
      Tags:
        - { Key: Project, Value: Antares }
        - { Key: Env, Value: dev }

  DemoVaultBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: antares-dev-vault
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - { Key: Project, Value: Antares }
        - { Key: Env, Value: dev }

  DemoParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /antares/dev/payments/gateway_endpoint
      Type: String
      Value: https://api.internal.example/v1
      Tags:
        Project: Antares
        Env: dev

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: antares-dev-site
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      Tags:
        - { Key: Project, Value: Antares }
        - { Key: Env, Value: dev }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"

  SigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Antares bypass token signing (HMAC_SHA_256, doc 05 section 5)
      KeySpec: HMAC_256
      KeyUsage: GENERATE_VERIFY_MAC
      Enabled: true
      PendingWindowInDays: 7
      Tags:
        - { Key: Project, Value: Antares }
        - { Key: Env, Value: dev }

  SigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/antares-dev-signing
      TargetKeyId: !Ref SigningKey

  GateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/antares-dev-gate
      RetentionInDays: 7

  GateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: antares-dev-gate
      CodeUri: ../.aws-build
      Runtime: python3.12
      Handler: antares.handlers.gate_handler.handler
      MemorySize: 256
      Timeout: 15
      Architectures:
        - arm64
      Tracing: Active
      Environment:
        Variables:
          ANTARES_TABLE_NAME: antares-dev-main
          ANTARES_HALT: "false"
          ANTARES_POLICY_VERSION: 1.0
          ANTARES_ALLOWED_TABLES: antares-dev-main,antares-dev-ledger
          ANTARES_ALLOWED_BUCKETS: antares-dev-vault
          ANTARES_SSM_PREFIX: /antares/dev/
          ANTARES_REASONER_MODEL: us.amazon.nova-pro-v1:0
          ANTARES_ADVERSARY_MODEL: us.meta.llama3-3-70b-instruct-v1:0
          ANTARES_PERIMETER_MODEL: us.amazon.nova-lite-v1:0
          ANTARES_SIGNING_KEY_ID: !Ref SigningKeyAlias
          POWERTOOLS_SERVICE_NAME: antares-gate
          POWERTOOLS_METRICS_NAMESPACE: Antares
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt MainTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:DescribeTable
                - dynamodb:DescribeContinuousBackups
              Resource: !GetAtt DemoLedgerTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:GetBucketVersioning
              Resource:
                - !Sub "${DemoVaultBucket.Arn}/*"
                - !GetAtt DemoVaultBucket.Arn
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/antares/dev/*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0"
                - !Sub "arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0"
                - !Sub "arn:aws:bedrock:*::foundation-model/amazon.nova-micro-v1:0"
                - !Sub "arn:aws:bedrock:*::foundation-model/meta.llama3-3-70b-instruct-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action:
                - kms:GenerateMac
                - kms:VerifyMac
              Resource: !GetAtt SigningKey.Arn
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !GetAtt GateLogGroup.Arn
        - AWSXRayDaemonWriteAccess
      Events:
        Gate:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/gate
            Method: post
        Screen:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/screen
            Method: post
        Canaries:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/canaries
            Method: post
        TripwireCheck:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/tripwire/check
            Method: post
        Incidents:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/incidents
            Method: get
        Metrics:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/metrics
            Method: get
        Attacks:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/attacks
            Method: get
        Decision:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/decisions/{id}
            Method: get
        Execute:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/execute
            Method: post
        Rollback:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/actions/{id}/rollback
            Method: post
        Receipt:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /v1/actions/{id}/receipt
            Method: get

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: antares-dev-api
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiV1Resource:
    Type: AWS::ApiGateway::Resource
