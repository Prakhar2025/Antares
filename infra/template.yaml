AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Antares dev namespace (P1): gate API and decision store.
  Least-privilege by construction: the only writable resource is the
  antares-dev-main table. No NAT, no always-on compute, no Bedrock in P1.
  Single-table dual-write pattern: no GSIs (the account-level
  early-validation hook rejects GSI creation; recorded in what-broke).
  The API is expressed as raw API Gateway resources with explicit
  DependsOn ordering, because SAM's implicit stage ordering raced the
  usage plan (also recorded in what-broke).

Resources:
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: antares-dev-main
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - { Key: Project, Value: Antares }
        - { Key: Env, Value: dev }

  SigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Antares bypass token signing (HMAC_SHA_256, doc 05 section 5)
      KeySpec: HMAC_256
      KeyUsage: GENERATE_VERIFY_MAC
      Enabled: true
      PendingWindowInDays: 7
      Tags:
        - { Key: Project, Value: Antares }
        - { Key: Env, Value: dev }

  SigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/antares-dev-signing
      TargetKeyId: !Ref SigningKey

  GateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/antares-dev-gate
      RetentionInDays: 7

  GateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: antares-dev-gate
      CodeUri: ../.aws-build
      Runtime: python3.12
      Handler: antares.handlers.gate_handler.handler
      MemorySize: 256
      Timeout: 10
      Architectures:
        - arm64
      Environment:
        Variables:
          ANTARES_TABLE_NAME: antares-dev-main
          ANTARES_HALT: "false"
          ANTARES_POLICY_VERSION: p1
          ANTARES_ALLOWED_TABLES: antares-dev-main,antares-dev-ledger
          ANTARES_ALLOWED_BUCKETS: antares-dev-vault
          ANTARES_SSM_PREFIX: /antares/dev/
          ANTARES_REASONER_MODEL: us.amazon.nova-pro-v1:0
          ANTARES_ADVERSARY_MODEL: us.meta.llama3-3-70b-instruct-v1:0
          ANTARES_PERIMETER_MODEL: us.amazon.nova-lite-v1:0
          ANTARES_SIGNING_KEY_ID: !Ref SigningKeyAlias
          POWERTOOLS_SERVICE_NAME: antares-gate
          POWERTOOLS_METRICS_NAMESPACE: Antares
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt MainTable.Arn
        - AWSXRayDaemonWriteAccess
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/meta.llama3-3-70b-instruct-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
            - Effect: Allow
              Action:
                - kms:GenerateMac
                - kms:VerifyMac
              Resource: !GetAtt SigningKey.Arn

  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: antares-dev-api
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiV1Resource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: v1

  ApiGateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !Ref ApiV1Resource
      PathPart: gate

  ApiDecisionsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !Ref ApiV1Resource
      PathPart: decisions

  ApiDecisionIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !Ref ApiDecisionsResource
      PathPart: "{id}"

  GateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref ApiGateResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GateFunction.Arn}/invocations"

  DecisionMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref ApiDecisionIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GateFunction.Arn}/invocations"

  GateInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GateFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GateMethod
      - DecisionMethod
    Properties:
      RestApiId: !Ref Api

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: dev
      TracingEnabled: true
      Tags:
        - { Key: Project, Value: Antares }
        - { Key: Env, Value: dev }

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: ApiStage
    Properties:
      Name: antares-dev-key
      Enabled: true
      StageKeys:
        - { RestApiId: !Ref Api, StageName: dev }

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: antares-dev-plan
      ApiStages:
        - { ApiId: !Ref Api, Stage: dev }
      Throttle:
        RateLimit: 20
        BurstLimit: 40
      Quota:
        Limit: 5000
        Period: DAY

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Outputs:
  ApiUrl:
    Description: Dev gate API base URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev"
  ApiKeyId:
    Description: API key id (fetch the value with apigateway get-api-key)
    Value: !Ref ApiKey
  TableName:
    Description: Decision store table
    Value: antares-dev-main
