  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref ApiDeployment
      StageName: dev
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
      Tags:
        - { Key: Project, Value: Antares }
        - { Key: Env, Value: dev }

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: antares-dev-key
      Enabled: true
      StageKeys:
        - { RestApiId: !Ref Api, StageName: dev }
      Tags:
        - { Key: Project, Value: Antares }
        - { Key: Env, Value: dev }

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: antares-dev-plan
      ApiStages:
        - { ApiId: !Ref Api, Stage: dev }
      Throttle:
        RateLimit: 20
        BurstLimit: 40
      Quota:
        Limit: 5000
        Period: DAY

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan


  ConsoleIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: antares-console-index
      AutoPublish: true
      FunctionConfig:
        Comment: resolve clean URLs to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith("/")) {
            request.uri = uri + "index.html";
          } else if (!uri.split(".").pop().match(/^(html|js|css|txt|json|svg|png|jpg|woff2?|map|ico)$/)) {
            request.uri = uri + "/index.html";
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Antares console and API proxy
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: site-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ConsoleIndexFunction.FunctionMetadata.FunctionARN

Outputs:
  PublicUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  ApiUrl:
    Description: Direct regional API (API-key gated for destructive routes)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/dev"
  TableName:
    Description: Decision store table
    Value: antares-dev-main
