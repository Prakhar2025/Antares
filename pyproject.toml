[project]
name = "antares"
version = "0.1.0"
description = "The execution governor for autonomous AI agents: gate, quorum, probes, saga, ledger."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2,<3",
    "boto3>=1.42",
    "orjson>=3.10",
    "aws-lambda-powertools>=3",
    "aws-xray-sdk>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antares"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true

[tool.coverage.run]
omit = [
    # Thin Lambda entrypoints: wired and exercised by the live deploy smoke test,
    # everything testable lives in create_app with injected fakes (doc 14).
    "src/antares/handlers/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
