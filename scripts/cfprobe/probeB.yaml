AWSTemplateFormatVersion: "2010-09-09"
Resources:
  ProbeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: antares-dev-cfprobe5
  Dist:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: false
        Comment: probe A
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: site
            DomainName: !GetAtt ProbeBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: probe.example.execute-api.us-east-1.amazonaws.com
            OriginPath: /dev
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CacheBehaviors:
          - PathPattern: /v1/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a1-20e0-46f7-8e46-4e8ec0e8bb02
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
